<head>

<script>(function () {
  function makeStore() {
    var bag = Object.create(null);
    var keys = [];
    var api = {
      getItem: function (key) {
        key = String(key);
        return Object.prototype.hasOwnProperty.call(bag, key) ? bag[key] : null;
      },
      setItem: function (key, value) {
        key = String(key);
        if (!Object.prototype.hasOwnProperty.call(bag, key)) keys.push(key);
        bag[key] = String(value);
      },
      removeItem: function (key) {
        key = String(key);
        if (!Object.prototype.hasOwnProperty.call(bag, key)) return;
        delete bag[key];
        keys = keys.filter(function (item) { return item !== key; });
      },
      clear: function () { bag = Object.create(null); keys = []; },
      key: function (index) { return keys[index] == null ? null : keys[index]; }
    };
    Object.defineProperty(api, 'length', { get: function () { return keys.length; } });
    Object.defineProperty(api, '__playground', { value: true });
    return api;
  }
  function install(name, api) {
    try {
      Object.defineProperty(window, name, { configurable: true, get: function () { return api; } });
    } catch (err) {
      try { window[name] = api; } catch (err2) {}
    }
  }
  var memory = makeStore();
  var session = makeStore();
  install('localStorage', memory);
  install('sessionStorage', session);
  window.Playground = window.Playground || {};
  window.Playground.submitScore = function (n) {
    var points = Math.max(0, Math.min(100000, Math.floor(Number(n) || 0)));
    window.__share = 'Score ' + points;
    try { parent.postMessage({ type: 'playground-score', points: points }, '*'); } catch (err) {}
  };
})();</script>

<style>@font-face{font-family:"Lilita One";src:url("/fonts/lilita-one-latin.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Rubik;src:url("/fonts/rubik-latin-700.woff2") format("woff2");font-weight:700;font-display:swap}
html,body{margin:0!important;padding:0!important;height:100%;background:#4FB3FF;overflow:hidden;}
#pg-root{position:absolute;left:0;top:0;width:max-content;height:max-content;transform-origin:0 0;}
#pg-start,#pg-credit,#pg-pad{font-family:Rubik,sans-serif;}
#pg-start{position:fixed;inset:0;z-index:8;display:flex;align-items:flex-end;justify-content:center;padding:0 0 28px;border:0;background:transparent;color:#1B1B2F;font-family:"Lilita One",sans-serif;font-size:28px;box-shadow:inset 0 -190px 0 rgba(8,10,16,.72);}
#pg-start span{display:inline-flex;align-items:center;justify-content:center;width:200px;height:64px;background:#FFD23F;border-bottom:4px solid #B8860B;border-radius:14px;}
#pg-start:active span{transform:translateY(3px);}
#pg-start[hidden]{display:none;}
#pg-credit{position:fixed;top:12px;left:12px;z-index:4;margin:0;padding:4px 8px;background:#1B1B2F;color:#F4F7FB;font-size:12px;border-radius:8px;}
#pg-pad{position:fixed;left:12px;right:12px;bottom:12px;z-index:6;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;opacity:.35;}
#pg-pad:has(button:active){opacity:.7;}
#pg-pad button{pointer-events:auto;width:52px;height:48px;margin:2px;background:#1B1B2F;color:#F4F7FB;border:3px solid #1B1B2F;border-radius:999px;font-family:"Lilita One",sans-serif;font-size:16px;}
#pg-a{width:72px;height:72px;background:#FFD23F;color:#1B1B2F;border:0;border-bottom:4px solid #B8860B;}
#pg-dpad{display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:48px 48px 48px;}
#pg-up{grid-column:2;grid-row:1;}
#pg-left{grid-column:1;grid-row:2;}
#pg-right{grid-column:3;grid-row:2;}
#pg-down{grid-column:2;grid-row:3;}
#pg-actions{display:flex;gap:8px;align-items:flex-end;}</style>
</head>
<body>
<button id="pg-start" type="button"><span>Play</span></button>
<p id="pg-credit">Original by Jake Gordon (MIT)</p>
<div id="pg-pad">
<div id="pg-dpad">
<button id="pg-up" type="button" aria-label="Up">↑</button>
<button id="pg-left" type="button" aria-label="Left">←</button>
<button id="pg-right" type="button" aria-label="Right">→</button>
<button id="pg-down" type="button" aria-label="Down">↓</button>
</div>
<div id="pg-actions">
<button id="pg-a" type="button">A</button>
<button id="pg-b" type="button">B</button>
</div>
</div>
<div id="pg-root">


  <div id="stack">
    <div id="menu">
      <p id="start"><a href="javascript:play();">Press Space to Play.</a></p>
      <p><canvas id="upcoming"></canvas></p>
      <p>score <span id="score">00000</span></p>
      <p>rows <span id="rows">0</span></p>
    </div>
    <canvas id="canvas">
      Sorry, this example cannot be run because your browser does not support the &lt;canvas&gt; element
    </canvas>
  </div>

  <script>function Stats(){this.domElement=document.createElement("div");this.begin=this.end=this.update=function(){};}</script>
  <script>

    
    
    

    function get(id)        { return document.getElementById(id);  }
    function hide(id)       { get(id).style.visibility = 'hidden'; }
    function show(id)       { get(id).style.visibility = null;     }
    function html(id, html) { get(id).innerHTML = html;            }

    function timestamp()           { return new Date().getTime();                             }
    function random(min, max)      { return (min + (Math.random() * (max - min)));            }
    function randomChoice(choices) { return choices[Math.round(random(0, choices.length-1))]; }

    if (!window.requestAnimationFrame) { 
      window.requestAnimationFrame = window.webkitRequestAnimationFrame ||
                                     window.mozRequestAnimationFrame    ||
                                     window.oRequestAnimationFrame      ||
                                     window.msRequestAnimationFrame     ||
                                     function(callback, element) {
                                       window.setTimeout(callback, 1000 / 60);
                                     }
    }

    
    
    

    var KEY     = { ESC: 27, SPACE: 32, LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40 },
        DIR     = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3, MIN: 0, MAX: 3 },
        stats   = new Stats(),
        canvas  = get('canvas'),
        ctx     = canvas.getContext('2d'),
        ucanvas = get('upcoming'),
        uctx    = ucanvas.getContext('2d'),
        speed   = { start: 0.6, decrement: 0.005, min: 0.1 }, 
        nx      = 10, 
        ny      = 20, 
        nu      = 5;  

    
    
    

    var dx, dy,        
        blocks,        
        actions,       
        playing,       
        dt,            
        current,       
        next,          
        score,         
        vscore,        
        rows,          
        step;          

    
    
    
    
    
    
    
    
    
    
    
    
    
    
    

    var i = { size: 4, blocks: [0x0F00, 0x2222, 0x00F0, 0x4444], color: 'cyan'   };
    var j = { size: 3, blocks: [0x44C0, 0x8E00, 0x6440, 0x0E20], color: 'blue'   };
    var l = { size: 3, blocks: [0x4460, 0x0E80, 0xC440, 0x2E00], color: 'orange' };
    var o = { size: 2, blocks: [0xCC00, 0xCC00, 0xCC00, 0xCC00], color: 'yellow' };
    var s = { size: 3, blocks: [0x06C0, 0x8C40, 0x6C00, 0x4620], color: 'green'  };
    var t = { size: 3, blocks: [0x0E40, 0x4C40, 0x4E00, 0x4640], color: 'purple' };
    var z = { size: 3, blocks: [0x0C60, 0x4C80, 0xC600, 0x2640], color: 'red'    };

    
    
    
    
    function eachblock(type, x, y, dir, fn) {
      var bit, result, row = 0, col = 0, blocks = type.blocks[dir];
      for(bit = 0x8000 ; bit > 0 ; bit = bit >> 1) {
        if (blocks & bit) {
          fn(x + col, y + row);
        }
        if (++col === 4) {
          col = 0;
          ++row;
        }
      }
    }

    
    
    
    function occupied(type, x, y, dir) {
      var result = false
      eachblock(type, x, y, dir, function(x, y) {
        if ((x < 0) || (x >= nx) || (y < 0) || (y >= ny) || getBlock(x,y))
          result = true;
      });
      return result;
    }

    function unoccupied(type, x, y, dir) {
      return !occupied(type, x, y, dir);
    }

    
    
    
    
    var pieces = [];
    function randomPiece() {
      if (pieces.length == 0)
        pieces = [i,i,i,i,j,j,j,j,l,l,l,l,o,o,o,o,s,s,s,s,t,t,t,t,z,z,z,z];
      var type = pieces.splice(random(0, pieces.length-1), 1)[0];
      return { type: type, dir: DIR.UP, x: Math.round(random(0, nx - type.size)), y: 0 };
    }


    
    
    

    function run() {

      showStats(); 
      addEvents(); 

      var last = now = timestamp();
      function frame() {
        now = timestamp();
        update(Math.min(1, (now - last) / 1000.0)); 
        draw();
        stats.update();
        last = now;
        requestAnimationFrame(frame, canvas);
      }

      resize(); 
      reset();  
      frame();  

    }

    function showStats() {
      stats.domElement.id = 'stats';
      get('menu').appendChild(stats.domElement);
    }

    function addEvents() {
      document.addEventListener('keydown', keydown, false);
      window.addEventListener('resize', resize, false);
    }

    function resize(event) {
      canvas.width   = canvas.clientWidth;  
      canvas.height  = canvas.clientHeight; 
      ucanvas.width  = ucanvas.clientWidth;
      ucanvas.height = ucanvas.clientHeight;
      dx = canvas.width  / nx; 
      dy = canvas.height / ny; 
      invalidate();
      invalidateNext();
    }

    function keydown(ev) {
      var handled = false;
      if (playing) {
        switch(ev.keyCode) {
          case KEY.LEFT:   actions.push(DIR.LEFT);  handled = true; break;
          case KEY.RIGHT:  actions.push(DIR.RIGHT); handled = true; break;
          case KEY.UP:     actions.push(DIR.UP);    handled = true; break;
          case KEY.DOWN:   actions.push(DIR.DOWN);  handled = true; break;
          case KEY.ESC:    lose();                  handled = true; break;
        }
      }
      else if (ev.keyCode == KEY.SPACE) {
        play();
        handled = true;
      }
      if (handled)
        ev.preventDefault(); 
    }

    
    
    

    function play() { hide('start'); reset();          playing = true;  }
    function lose() { show('start'); setVisualScore(); playing = false; }

    function setVisualScore(n)      { vscore = n || score; invalidateScore(); }
    function setScore(n)            { score = n; setVisualScore(n);  }
    function addScore(n)            { score = score + n;   }
    function clearScore()           { setScore(0); }
    function clearRows()            { setRows(0); }
    function setRows(n)             { rows = n; step = Math.max(speed.min, speed.start - (speed.decrement*rows)); invalidateRows(); }
    function addRows(n)             { setRows(rows + n); }
    function getBlock(x,y)          { return (blocks && blocks[x] ? blocks[x][y] : null); }
    function setBlock(x,y,type)     { blocks[x] = blocks[x] || []; blocks[x][y] = type; invalidate(); }
    function clearBlocks()          { blocks = []; invalidate(); }
    function clearActions()         { actions = []; }
    function setCurrentPiece(piece) { current = piece || randomPiece(); invalidate();     }
    function setNextPiece(piece)    { next    = piece || randomPiece(); invalidateNext(); }

    function reset() {
      dt = 0;
      clearActions();
      clearBlocks();
      clearRows();
      clearScore();
      setCurrentPiece(next);
      setNextPiece();
    }

    function update(idt) {
      if (playing) {
        if (vscore < score)
          setVisualScore(vscore + 1);
        handle(actions.shift());
        dt = dt + idt;
        if (dt > step) {
          dt = dt - step;
          drop();
        }
      }
    }

    function handle(action) {
      switch(action) {
        case DIR.LEFT:  move(DIR.LEFT);  break;
        case DIR.RIGHT: move(DIR.RIGHT); break;
        case DIR.UP:    rotate();        break;
        case DIR.DOWN:  drop();          break;
      }
    }

    function move(dir) {
      var x = current.x, y = current.y;
      switch(dir) {
        case DIR.RIGHT: x = x + 1; break;
        case DIR.LEFT:  x = x - 1; break;
        case DIR.DOWN:  y = y + 1; break;
      }
      if (unoccupied(current.type, x, y, current.dir)) {
        current.x = x;
        current.y = y;
        invalidate();
        return true;
      }
      else {
        return false;
      }
    }

    function rotate() {
      var newdir = (current.dir == DIR.MAX ? DIR.MIN : current.dir + 1);
      if (unoccupied(current.type, current.x, current.y, newdir)) {
        current.dir = newdir;
        invalidate();
      }
    }

    function drop() {
      if (!move(DIR.DOWN)) {
        addScore(10);
        dropPiece();
        removeLines();
        setCurrentPiece(next);
        setNextPiece(randomPiece());
        clearActions();
        if (occupied(current.type, current.x, current.y, current.dir)) {
          lose();
        }
      }
    }

    function dropPiece() {
      eachblock(current.type, current.x, current.y, current.dir, function(x, y) {
        setBlock(x, y, current.type);
      });
    }

    function removeLines() {
      var x, y, complete, n = 0;
      for(y = ny ; y > 0 ; --y) {
        complete = true;
        for(x = 0 ; x < nx ; ++x) {
          if (!getBlock(x, y))
            complete = false;
        }
        if (complete) {
          removeLine(y);
          y = y + 1; 
          n++;
        }
      }
      if (n > 0) {
        addRows(n);
        addScore(100*Math.pow(2,n-1)); 
      }
    }

    function removeLine(n) {
      var x, y;
      for(y = n ; y >= 0 ; --y) {
        for(x = 0 ; x < nx ; ++x)
          setBlock(x, y, (y == 0) ? null : getBlock(x, y-1));
      }
    }

    
    
    

    var invalid = {};

    function invalidate()         { invalid.court  = true; }
    function invalidateNext()     { invalid.next   = true; }
    function invalidateScore()    { invalid.score  = true; }
    function invalidateRows()     { invalid.rows   = true; }

    function draw() {
      ctx.save();
      ctx.lineWidth = 1;
      ctx.translate(0.5, 0.5); 
      drawCourt();
      drawNext();
      drawScore();
      drawRows();
      ctx.restore();
    }

    function drawCourt() {
      if (invalid.court) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (playing)
          drawPiece(ctx, current.type, current.x, current.y, current.dir);
        var x, y, block;
        for(y = 0 ; y < ny ; y++) {
          for (x = 0 ; x < nx ; x++) {
            if (block = getBlock(x,y))
              drawBlock(ctx, x, y, block.color);
          }
        }
        ctx.strokeRect(0, 0, nx*dx - 1, ny*dy - 1); 
        invalid.court = false;
      }
    }

    function drawNext() {
      if (invalid.next) {
        var padding = (nu - next.type.size) / 2; 
        uctx.save();
        uctx.translate(0.5, 0.5);
        uctx.clearRect(0, 0, nu*dx, nu*dy);
        drawPiece(uctx, next.type, padding, padding, next.dir);
        uctx.strokeStyle = 'black';
        uctx.strokeRect(0, 0, nu*dx - 1, nu*dy - 1);
        uctx.restore();
        invalid.next = false;
      }
    }

    function drawScore() {
      if (invalid.score) {
        html('score', ("00000" + Math.floor(vscore)).slice(-5));
        invalid.score = false;
      }
    }

    function drawRows() {
      if (invalid.rows) {
        html('rows', rows);
        invalid.rows = false;
      }
    }

    function drawPiece(ctx, type, x, y, dir) {
      eachblock(type, x, y, dir, function(x, y) {
        drawBlock(ctx, x, y, type.color);
      });
    }

    function drawBlock(ctx, x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x*dx, y*dy, dx, dy);
      ctx.strokeRect(x*dx, y*dy, dx, dy)
    }

    
    
    

    run();

  </script>


</div>
<script>(function () {
  var root = document.getElementById('pg-root');
  function fit() {
    if (!root) return;
    root.style.transform = 'none';
    var w = root.scrollWidth;
    var h = root.scrollHeight;
    if (w < 8 || h < 8) {
      var canvas = root.querySelector('canvas');
      if (canvas) {
        w = canvas.width || canvas.offsetWidth || w;
        h = canvas.height || canvas.offsetHeight || h;
      }
    }
    if (w < 8) w = 320;
    if (h < 8) h = 320;
    var scale = Math.min(window.innerWidth / w, window.innerHeight / h);
    if (!isFinite(scale) || scale <= 0) scale = 1;
    var tx = Math.round((window.innerWidth - w * scale) / 2);
    var ty = Math.round((window.innerHeight - h * scale) / 2);
    root.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
    try {
      parent.postMessage({ type: 'playground-fit', width: Math.round(w * scale), height: Math.round(h * scale) }, '*');
    } catch (err) {}
  }
  window.addEventListener('resize', fit);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fit);
  else fit();
  window.addEventListener('load', function () { fit(); setTimeout(fit, 60); });
  var selector = document.documentElement.getAttribute('data-pg-score');
  if (selector) {
    var arm = function () {
      var el = document.querySelector(selector);
      if (!el || typeof MutationObserver !== 'function') return;
      var last = null;
      var send = function () {
        var n = parseInt(String(el.textContent).replace(/[^0-9]/g, ''), 10);
        if (!isFinite(n) || n === last) return;
        last = n;
        if (window.Playground) window.Playground.submitScore(n);
      };
      new MutationObserver(send).observe(el, { childList: true, characterData: true, subtree: true });
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arm);
    else arm();
  }
  var start = document.getElementById('pg-start');
  function unlock() {
    if (start) start.hidden = true;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC) {
      try {
        var ctx = new AC();
        if (ctx.resume) ctx.resume();
      } catch (err) {}
    }
    var media = document.querySelectorAll('audio,video');
    for (var i = 0; i < media.length; i++) {
      try { var play = media[i].play; if (play) play.call(media[i]); } catch (err) {}
    }
  }
  if (start) {
    start.addEventListener('pointerdown', function (event) {
      event.preventDefault();
      unlock();
    });
  }
  function emit(type, key, code) {
    var ev;
    try {
      ev = new KeyboardEvent(type, { key: key, bubbles: true, cancelable: true });
      Object.defineProperty(ev, 'keyCode', { get: function () { return code; } });
      Object.defineProperty(ev, 'which', { get: function () { return code; } });
    } catch (err) {
      ev = null;
    }
    if (!ev || ev.keyCode !== code) {
      ev = document.createEvent('Event');
      ev.initEvent(type, true, true);
      ev.key = key;
      ev.keyCode = code;
      ev.which = code;
    }
    document.dispatchEvent(ev);
    window.dispatchEvent(ev);
  }
  function bind(el, pairs) {
    if (!el) return;
    var timer = 0;
    function down(event) {
      event.preventDefault();
      pairs.forEach(function (pair) { emit('keydown', pair[0], pair[1]); });
      if (timer) clearInterval(timer);
      timer = setInterval(function () {
        pairs.forEach(function (pair) { emit('keydown', pair[0], pair[1]); });
      }, 140);
    }
    function up(event) {
      if (event) event.preventDefault();
      if (timer) clearInterval(timer);
      timer = 0;
      pairs.forEach(function (pair) { emit('keyup', pair[0], pair[1]); });
    }
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointerleave', up);
    el.addEventListener('pointercancel', up);
  }
  bind(document.getElementById('pg-up'), [['ArrowUp', 38]]);
  bind(document.getElementById('pg-down'), [['ArrowDown', 40]]);
  bind(document.getElementById('pg-left'), [['ArrowLeft', 37]]);
  bind(document.getElementById('pg-right'), [['ArrowRight', 39]]);
  bind(document.getElementById('pg-a'), [['z', 90], [' ', 32]]);
  bind(document.getElementById('pg-b'), [['x', 88]]);
})();</script>
