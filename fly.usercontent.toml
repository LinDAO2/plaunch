# Sandbox origin. Same image, SERVER_ROLE=usercontent, so it listens on PORT.
# Point a different domain here. See DEPLOY.md.
app = "playground-usercontent"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  SERVER_ROLE = "usercontent"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"
