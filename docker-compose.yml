# Local Postgres for Playground. The app itself runs with `npm start`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: playground
      POSTGRES_PASSWORD: playground
      POSTGRES_DB: playground
    ports:
      - "5432:5432"
    volumes:
      - playground_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playground -d playground"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  playground_pg:
